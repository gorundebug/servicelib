          description: |
            Fixed implementation used by language-independent connectors such
            as `Custom`.
        implementations:
          type: object
          additionalProperties:
            type: string
          description: |
            Transport implementation selections keyed by template target identifier.
            Target and implementation names are open identifiers declared by template packs.
            Optional: omitted targets use the defaults declared by their selected template packs.
            Explicit selections override those defaults. No language-specific selector fields exist.
        host:
          type: string
          description: Hostname or IP address. Applies to HTTP and gRPC connectors.
        port:
          type: integer
          description: Port number. Applies to HTTP and gRPC connectors.
          minimum: 80
          maximum: 65535
        connectionString:
          type: string
          description: PostgreSQL DSN supplied through runtime configuration, never embedded credentials in the model.
        region:
          type: string
          description: S3 region used by the selected connector implementation.
        forcePathStyle:
          type: boolean
          default: false
          description: Use path-style S3 addressing for a compatible endpoint.
        address:
          type: string
          description: gRPC connection address.
        connectionsCount:
          type: integer
          description: Number of independent transport connections used by a gRPC sink connector.
          minimum: 1
        brokers:
          type: string
          description: Comma-separated list of Kafka broker addresses (e.g. `kafka1:9092,kafka2:9092`). Applies to Kafka connectors.
        servers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: |
            Native server URLs for NATS, JetStream, RabbitMQ and Redis Streams connectors, supplied explicitly
            or through a generated environment-backed override. No implicit localhost
            server. NATS/JetStream accept nats:// and tls://; RabbitMQ accepts amqp://
            and amqps://. Redis Streams uses one standalone redis:// or rediss:// server.
            URLs have no path,
            query, fragment or embedded credentials. Explicit ports are in 1..65535.
            Mixed plain and TLS URLs require tlsEnabled=true to prevent downgrade.
            Keep credentials in runtime authentication overrides, not topology URLs.
        adminUrl:
          type: string
          description: Pulsar administrative HTTP(S) URL for explicit resource provisioning and policy verification. Credentials are runtime-only.
        redisDatabase:
          type: integer
          minimum: 0
          default: 0
          description: Redis Streams standalone database index, separate from server URLs.
        virtualHost:
          type: string
          default: '/'
          description: RabbitMQ virtual host. Supply separately from server URLs; omitted means the default '/' virtual host.
        connectTimeoutMs:
          type: integer
          minimum: 1
          maximum: 9223372036854
          default: 2000
          description: |
            NATS, JetStream, and RabbitMQ connection timeout in integer milliseconds; omitted
            means 2000 in every target language. Convert to the native SDK duration
            at the adapter boundary; this value is not seconds or nanoseconds.
        operationTimeoutMs:
          type: integer
          minimum: 1
          maximum: 9223372036854
          default: 5000
          description: |
            NATS flush, JetStream operations, and RabbitMQ management/publication-outcome timeout
            in integer milliseconds; omitted means 5000 in every target language.
            Convert to the native SDK duration at the adapter boundary. A timeout
            after publication may indicate unknown delivery. Core flush does not
            confirm subscriber processing. This does not enable request/reply.
        token:
          type: string
          writeOnly: true
          description: |
            NATS or JetStream authentication token. Supply through a generated
            environment-backed override. Mutually exclusive with username/password
            and credentialsFile; omission of all authentication fields means no auth.
        credentialsFile:
          type: string
          writeOnly: true
          description: |
            Path to a mounted NATS credentials file for NATS or JetStream, supplied
            through a generated environment-backed override. Mutually exclusive
            with token and username/password. Do not embed credential contents.
        version:
          type: string
          description: Kafka protocol version expected by the broker (e.g. `2.8.0`). Applies to Kafka connectors.
        dialTimeout:
          type: number
          description: Connection dial timeout in milliseconds. Applies to Kafka connectors.
          minimum: 0
          maximum: 3600000
        usePartitioner:
          type: boolean
          description: |
            When true, a custom Kafka partitioner is used for produced messages.
            The partitioner function is included in the generated stub.
            Applies to Kafka sink connectors.
        async:
          type: boolean
          description: |
            When true, the Kafka producer operates in async mode — messages are batched
            and acknowledged asynchronously. Applies to Kafka sink connectors.
        securityProtocol:
          $ref: '#/components/schemas/KafkaSecurityProtocol'
          description: Kafka transport security protocol.
        saslMechanism:
          $ref: '#/components/schemas/KafkaSaslMechanism'
          description: SASL mechanism used when securityProtocol enables SASL.
        username:
          type: string
          description: Kafka SASL, NATS/JetStream, or RabbitMQ SASL PLAIN username. Supply at runtime through the generated environment override. For NATS/JetStream, set with password and do not combine with token or credentialsFile.
          writeOnly: true
        password:
          type: string
          description: Kafka SASL, NATS/JetStream, or RabbitMQ SASL PLAIN password. Supply at runtime through the generated environment override. For NATS/JetStream, set with username and do not combine with token or credentialsFile.
          writeOnly: true
        useDedicatedListener:
          type: boolean
          description: |
            When true, this HTTP connector starts its own dedicated listener.
            When false, it shares the service's default HTTP server.
            Applies to HTTP source connectors.
        module:
          type: string
          description: |
            Contract module containing generated gRPC protobuf types for this connector.
            Used to resolve the correct generated bindings for each target language.
            Applies to gRPC connectors.
        namespace:
          type: string
          description: Temporal namespace. Applies to Temporal connectors.
        identity:
          type: string
          description: Temporal client and Worker identity. Applies to Temporal connectors.
        apiKey:
          type: string
          writeOnly: true
          description: Temporal API key. Supply at runtime through an environment-backed override.
        tlsEnabled:
          type: boolean
          description: Enables TLS for a Temporal, NATS, JetStream, or RabbitMQ connector. For NATS/JetStream, omission means false; a TLS server URL also requires TLS. Supply through a generated environment-backed override.
        tlsServerName:
          type: string
          description: Expected TLS server name for a Temporal, NATS, JetStream, or RabbitMQ connector. Omitted uses the server hostname; certificate verification must remain enabled. Supply through a generated environment-backed override.
        tlsCaFile:
          type: string
          description: Path to a PEM CA bundle mounted into the service container. For NATS/JetStream, omission uses system trust roots. Supply through a generated environment-backed override.
        tlsCertFile:
          type: string
          description: Path to a PEM client certificate for Temporal, NATS, JetStream, or RabbitMQ mTLS. Set together with tlsKeyFile. Supply through a generated environment-backed override.
        tlsKeyFile:
          type: string
          writeOnly: true
          description: Path to the PEM private key paired with tlsCertFile. Supply through a generated environment-backed override.
        workerStopTimeout:
          type: integer
          description: Maximum milliseconds for Temporal Workers to drain during shutdown; zero inherits the owning service shutdownTimeout.
      required:
        - id
        - name
        - type

    KafkaSecurityProtocol:
      type: string
      description: Kafka client transport security protocol.
      enum: [ 'PLAINTEXT', 'SASL_PLAINTEXT', 'SASL_SSL' ]
      x-enum-varnames:
        - PLAINTEXT
        - SASLPLAINTEXT
        - SASLSSL

    KafkaSaslMechanism:
      type: string
      description: Kafka SASL authentication mechanism.
      enum: [ 'PLAIN', 'SCRAM-SHA-256', 'SCRAM-SHA-512' ]
      x-enum-varnames:
        - PLAIN
        - SCRAMSHA256
        - SCRAMSHA512

    ScheduleOverlapPolicy:
      type: string
      description: Portable policy for a firing that overlaps a still-running firing.
      enum: [ 'Allow', 'Skip' ]

    ScheduleMissedRunPolicy:
      type: string
      description: Portable policy for a firing delayed while the scheduler process is running.
      enum: [ 'Skip', 'FireOnce' ]

    TemporalExecutionType:
      type: string
      description: |
        Execution domain entered by a Temporal endpoint.
        - `Activity`: execute the endpoint in the ordinary ServiceLib runtime graph.
        - `Workflow`: execute the endpoint in the deterministic Temporal Workflow domain.
      enum: [ 'Activity', 'Workflow' ]

    Endpoint:
      type: object
      description: |
        A specific entry or exit point on a data connector — an HTTP route, a Kafka topic,
        or a gRPC method. Each Input, Sink or Query stream node references exactly one endpoint.
        The endpoint determines the handler interface that the code generator produces.
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Unique identifier for this endpoint within the topology.
          example: 1
        name:
          type: string
          description: Human-readable endpoint name shown in the visual designer.
          example: IngestEndpoint
        idDataConnector:
          type: integer
          description: ID of the data connector this endpoint belongs to.
          example: 1
        enabled:
          type: boolean
          description: |
            Controls whether an endpoint starts its transport integration.
            When omitted or false, the endpoint remains in the execution graph but its
            external transport or scheduler is not started.
        tracingEnabled:
          type: boolean
          description: |
            Enables tracing for events admitted by this DataSource endpoint. The current
            reloadable value is evaluated for every inbound event. DataSink adapters ignore
            this flag and only propagate tracing already present in the message context.
        queryOperation:
          type: string
          enum: [Rows, Execute, GetObject, HeadObject, ListObjects, PutObject, DeleteObject]
          description: Operation of a Query endpoint. Completion invokes EndRequest with the ordinary result collector; no completion port exists.
        sqlFile:
          type: string
          description: Optional user-owned parameterized SQL file; omitted when the handler builds the query in code.
        fetchSize:
          type: integer
          minimum: 1
          default: 256
          description: Native row/page fetch size; not a separate graph queue or concurrency limit.
        bucket:
          type: string
          description: Optional default S3 bucket; the request builder may supply the bucket explicitly.
        httpMethodType:
          $ref: '#/components/schemas/HTTPMethodType'
        path:
          type: string
          description: URL path for HTTP endpoints (e.g. `/api/v1/orders`). Applies to HTTP connectors.
        functionName:
          type: string
          description: Name of the generated Go handler struct for this endpoint.
        functionPackage:
          type: string
          description: Subdirectory under the functions package where the generated handler is placed.
        publicFunction:
          type: boolean
          description: |
            When true, the generated handler is placed in the shared `pkg/functions` tree
            and can be imported by other services. When false, it goes into `internal/functions`.
        functionDescription:
          type: string
          description: Doc comment added to the generated handler struct.
        functionInitializerGroup:
          type: string
          description: Initializer group for dependency injection of the generated handler.
        functionModule:
          type: string
          description: |
            Name of a module defined in `StreamApp.modules`. When set (and `publicFunction: true`),
            the generated handler is placed in that module instead of the service module.
        topic:
          type: string
          description: Kafka topic name. Applies to Kafka endpoints.
        subject:
          type: string
          minLength: 1
          description: |
            Required native subject for NATS and JetStream endpoints. Sources may
            use subject wildcards; sinks require a concrete publish subject.
            For JetStream sources this is the durable consumer filter subject.
        queueName:
          type: string
          minLength: 1
          description: RabbitMQ source queue; sink destination when exchangeName is absent. Also the destination of an explicitly created exchange-to-queue binding.
        exchangeName:
          type: string
          minLength: 1
          description: RabbitMQ sink exchange destination or source exchange for an explicitly created binding.
        routingKey:
          type: string
          description: RabbitMQ exchange publication key and exchange-to-queue binding key; empty is a valid key.
        queueType:
          $ref: '#/components/schemas/RabbitMQQueueType'
        exchangeType:
          $ref: '#/components/schemas/RabbitMQExchangeType'
        createQueue:
          type: boolean
          default: false
          description: RabbitMQ only. Explicitly permits declaring a durable nonexclusive non-auto-delete queue, default quorum. False requires an existing queue. Never reconcile an incompatible queue.
        createExchange:
          type: boolean
          default: false
          description: RabbitMQ only. Explicitly permits declaring a durable non-auto-delete exchange, default direct. False never declares an exchange. Never reconcile an incompatible exchange.
        createBinding:
          type: boolean
          default: false
          description: RabbitMQ only. Explicitly permits creating an exchangeName-to-queueName binding with routingKey. Does not enable queue or exchange creation and never removes bindings.
        subscriptionName:
          type: string
          minLength: 1
          description: Pulsar source durable subscription name. Stop never deletes this subscription.
        subscriptionType:
          type: string
          enum: ['Shared', 'Exclusive', 'Failover']
          default: 'Shared'
          description: Pulsar source subscription dispatch mode; acknowledgements are individual in every mode.
        createSubscription:
          type: boolean
          default: false
          description: Pulsar source explicit subscription creation; independent of createTopic.
        subscriptionInitialPosition:
          type: string
          enum: ['Earliest', 'Latest']
          default: 'Earliest'
          description: Pulsar subscription creation position only; never resets an existing subscription.
        receiverQueueSize:
          type: integer
          minimum: 1
          maximum: 4096
          default: 256
          description: Pulsar source native receive queue capacity; no unbounded adapter queue.
        negativeAckRedeliveryDelayMs:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 60000
          description: Pulsar source native negative acknowledgement redelivery delay; scheduling is approximate.
        streamKey:
          type: string
          minLength: 1
          description: Redis Streams. Exact Redis stream key, not a pattern.
        consumerName:
          type: string
          minLength: 1
          description: Redis Streams. Source consumer identity; omitted generates a unique endpoint instance name.
        createConsumerGroup:
          type: boolean
          default: false
          description: Redis Streams. Opt-in XGROUP CREATE MKSTREAM; never resets an existing group.
        groupStartId:
          type: string
          minLength: 1
          default: '0-0'
          description: Redis Streams. Group creation position, 0-0 or $, only with createConsumerGroup.
        readCount:
          type: integer
          minimum: 1
          maximum: 4096
          default: 64
          description: Redis Streams. Maximum source read or reclaim batch.
        readBlockMs:
          type: integer
          minimum: 1
          maximum: 60000
          default: 1000
          description: Redis Streams. Bounded blocking read milliseconds on a dedicated connection.
        claimIdleMs:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 60000
          description: Redis Streams. Minimum idle age for pending reclaim; does not fence former owners.
        claimIntervalMs:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1000
          description: Redis Streams. Reclaim scan cadence in milliseconds with retained cursor.
        consumerCredits:
          type: integer
          minimum: 1
          maximum: 4096
          default: 256
          description: RabbitMQ delivery admission bound; TypeScript bounds local work, not native wire credit. Explicit per-delivery settlement is required; request Done never settles.
        publisherMaxInFlight:
          type: integer
          minimum: 1
          maximum: 4096
          default: 256
          description: RabbitMQ, Redis Streams or Pulsar sink maximum outstanding native asynchronous publications; adapter byte capacity is additionally bounded.
        queueGroup:
          type: string
          minLength: 1
          description: |
            Optional Core NATS source queue group. Omitted means an independent
            subscription. Not applicable to sinks or JetStream durable pull consumers.
        streamName:
          type: string
          minLength: 1
          description: Required native stream name for JetStream source and sink endpoints.
        durableName:
          type: string
          minLength: 1
          description: |
            Required durable pull consumer name for JetStream sources. Not applicable
            to sinks. Consumers use explicit acknowledgement; completing the service
            request lifecycle does not acknowledge a message.
        createStream:
          type: boolean
          default: false
          description: |
            Redis Streams sinks: true permits XADD to create a missing key; false
            uses NOMKSTREAM and reports a missing stream. No implicit trimming.
            JetStream: false or omitted requires an existing stream and must
            not provision it. True permits creating a missing stream covering subject
            with file storage and one replica. Never delete or reconfigure an existing
            stream; reject an incompatible stream rather than silently changing it.
        createConsumer:
          type: boolean
          default: false
          description: |
            JetStream sources only. False or omitted requires an existing durable
            pull consumer. True permits creating a missing durableName consumer on
            streamName, filtered by subject, with explicit acknowledgement, delivery
            of all available messages, and instant replay. Never delete or reconfigure
            an existing consumer; reject incompatible configuration. Independent of
            createStream. Core NATS subjects require no resource creation.
        partitions:
          type: integer
          description: "Number of partitions for the Kafka topic (used when createTopic is true)."
          minimum: 1
          maximum: 1000
        createTopic:
          type: boolean
          default: false
          description: Explicitly allows missing Kafka or Pulsar topic creation at startup; never changes an existing topic. Pulsar tenant and namespace must already exist.
        replicationFactor:
          type: integer
          description: "Kafka topic replication factor (used when createTopic is true)."
          minimum: 1
          maximum: 1000
        consumerGroup:
          type: string
          description: Kafka or Redis Streams source consumer group ID. Redis groups use explicit XACK, not Kafka offsets.
        grpcMethodType:
          $ref: '#/components/schemas/GrpcMethodType'
        methodName:
          type: string
          description: gRPC method name as defined in the proto file. Applies to gRPC endpoints.
        schedule:
          type: string
          description: 'Local Cron accepts a portable five-field calendar expression or @every Nms with canonical integer milliseconds from 10 to 86400000. Temporal schedules accept only the five-field calendar expression. Both require UTC; local intervals do not provide durable replay.'
        scheduleId:
          type: string
          description: Immutable Temporal Schedule ID. Required when a Temporal endpoint has a schedule.
        timezone:
          type: string
          description: Timezone used to evaluate the schedule. The portable contract accepts only UTC.
        overlapPolicy:
          $ref: '#/components/schemas/ScheduleOverlapPolicy'
        missedRunPolicy:
          $ref: '#/components/schemas/ScheduleMissedRunPolicy'
        taskQueue:
          type: string
          description: Temporal Task Queue used by this durable endpoint.
        temporalExecutionType:
          $ref: '#/components/schemas/TemporalExecutionType'
          description: Required immutable execution domain for a Temporal endpoint.
        maxConcurrentActivities:
          type: integer
          minimum: 1
          description: Maximum Activity Task executions for this endpoint's Task Queue. Applies to Activity endpoints.
        maxConcurrentWorkflowTasks:
          type: integer
          minimum: 1
          description: Maximum Workflow Task executions for this endpoint's Task Queue. Applies to Workflow endpoints; this does not limit open Workflow executions.
        workflowExecutionTimeout:
          type: integer
          minimum: 0
          description: Temporal Workflow execution timeout in milliseconds; zero means SDK default.
        activityStartToCloseTimeout:
          type: integer
          minimum: 1
          description: Temporal Activity start-to-close timeout in milliseconds.
        activityHeartbeatTimeout:
          type: integer
          minimum: 0
          description: Temporal Activity heartbeat timeout in milliseconds; zero disables it.
        maximumAttempts:
          type: integer
          minimum: 1
          description: Maximum Temporal Activity attempts including the initial attempt.
      required:
        - id
        - name
        - idDataConnector
        - functionName

    TypeDefinitionFormat:
      type: integer
      description: |
        Serialization format used for the type definition. Determines how the type
        is serialized/deserialized when crossing process or network boundaries.
        - `Native` (1): language-native encoding (Go encoding/json, etc.)
        - `Protobuf` (2): Protocol Buffers
        - `FlatBuffers` (3): FlatBuffers
        - `CapNProto` (4): Cap'n Proto
        - `OpenAPI` (5): JSON encoding for types generated from an OpenAPI spec (oapi-codegen)
      enum: [0, 1, 2, 3, 4, 5]
      x-enum-varnames:
        - Undefined
        - Native
        - Protobuf
        - FlatBuffers
        - CapNProto
        - OpenAPI

    DataType:
      type: string
      description: |
        Primitive or composite data type for a named type. Controls generated serde code
        and type compatibility checks within the graph.
        Use `custom` for user-defined structs, `struct` for inline struct definitions,
        `array` for slices, `map` for maps, and `any` for untyped/interface values.
      enum: [ '',
              'int', 'uint', 'byte', 'char', 'boolean',
              'unicode char', 'string', 'unicode string',
              'float', 'double',
              'int8', 'int16', 'int32', 'int64',
              'uint8', 'uint16', 'uint32', 'uint64',
              'any', 'error', 'array', 'map', 'struct', 'custom'
      ]
      x-enum-varnames:
        - Undefined
        - int
        - uint
        - byte
        - char
        - boolean
        - unicodeChar
        - string
        - unicodeString
        - float
        - double
        - int8
        - int16
        - int32
        - int64
        - uint8
        - uint16
        - uint32
        - uint64
        - any
        - error
        - array
        - map
        - struct
        - custom

    NativeTypeBinding:
      type: object
      additionalProperties: false
      description: Authored native definition and import for a template target. The selected template pack interprets these strings; the generator does not translate them.
      properties:
        definition:
          type: string
          description: Native type expression or declaration. An explicitly empty string is distinct from an omitted definition.
        import:
          type: string
          description: Native module, package or header reference, preserved verbatim.
        package:
          type: string
          description: Optional native package name or alias, preserved verbatim.

    Type:
      type: object
      description: |
        A named data type used as a message type in the topology graph.
        Types are referenced by stream nodes via `valueType` and `keyType`.
        Template packs use the semantic type and its native bindings to render
        target-specific declarations and references.
      additionalProperties: false
      properties:
        name:
          type: string
          description: Unique type name referenced by streams (e.g. `OrderEvent`, `UserProfile`).
          example: OrderEvent
        description:
          type: string
          description: Human-readable description of this type. Used as a doc comment in generated code.
        type:
          $ref: '#/components/schemas/DataType'
        valueType:
          type: string
          description: Element type for `array` and value type for `map` composite types.
        keyType:
          type: string
          description: Key type for `map` composite types.
        definitionFormat:
          $ref: '#/components/schemas/TypeDefinitionFormat'
        transferByValue:
          type: boolean
          description: |
            When true, the type is passed by value in generated function signatures.
            When false (default), it is passed as a pointer.
          example: false
        useAlias:
          type: boolean
          description: When true, the generated Go code uses a type alias instead of a full struct definition.
        bindings:
          type: object
          description: |
            Native bindings keyed by an open template target name. Target keys
            are not restricted to built-in languages. Each entry contains only
            the definition, import and package intended for that target.
          additionalProperties:
            $ref: '#/components/schemas/NativeTypeBinding'
        package:
          type: string
          description: Go package name alias used in generated import statements when it differs from the last path component.
        publicType:
          type: boolean
          description: When true, this type is shared across services and placed in the shared types package.
        module:
          type: string
          description: |
            Name of a module defined in `StreamApp.modules` that owns this type.
            Used to resolve the correct import path when `publicType: true`.
      required:
        - name
        - type
