    DataConnector:
      type: object
      description: |
        Configuration for a connection to an external system. A data connector represents
        the external system itself (an HTTP server, a Kafka cluster, a gRPC server).
        Specific routes, topics, or methods are defined as `Endpoint` objects that
        reference this connector.
      additionalProperties: false
