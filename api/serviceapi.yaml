    Service:
      type: object
      description: |
        A single microservice in the topology. Each stream node belongs to exactly one service.
        The service defines the runtime configuration (ports, timeouts, logging) and the
        Go module path used for code generation.
      additionalProperties: false
      properties:
        deployment:
          $ref: '#/components/schemas/DeploymentSettings'
        id:
          type: integer
          description: Unique identifier for the service within the topology.
          example: 1
        name:
          type: string
          description: Human-readable service name. Used as the root directory name for generated code.
          example: ProcessingService
        programmingLanguage:
          $ref: '#/components/schemas/ProgrammingLanguage'
        modulePath:
          type: string
          description: |
            Go module path (e.g. `github.com/example/myservice`). Used as the base import path
            for all generated packages within this service.
        golangVersion:
          type: string
          description: Minimum Go version required for the generated module (e.g. `1.22`).
        defaultCallSemantics:
          $ref: '#/components/schemas/CallSemantics'
          description: Default delivery semantics for stream links that do not specify their own.
        httpHost:
          type: string
          description: Host address for the service's HTTP server.
        httpPort:
          type: integer
          description: Port for the service's HTTP server.
          minimum: 0
          maximum: 65535
        statusHandler:
          type: string
          description: |
            URL path for the built-in topology visualization endpoint (e.g. `/status`).
            When set, the service serves a live dataflow graph with real-time call counts.
            Leave empty to disable.
        metricsHandler:
          type: string
          description: |
            URL path for the Prometheus metrics endpoint (e.g. `/metrics`).
            Leave empty to disable.
        startupHandler:
          type: string
          description: URL path for the Kubernetes startup probe. Leave empty to disable.
        readinessHandler:
          type: string
          description: URL path for the Kubernetes readiness probe. Leave empty to disable.
        livenessHandler:
          type: string
          description: URL path for the Kubernetes liveness probe. Leave empty to disable.
        kubernetesWorkloadType:
          $ref: '#/components/schemas/KubernetesWorkloadType'
          description: Kubernetes controller generated for this service.
        grpcHost:
          type: string
          description: Host address for the service's gRPC server.
        grpcPort:
          type: integer
          description: Port for the service's gRPC server.
          minimum: 80
          maximum: 65535
        defaultGrpcTimeout:
          type: integer
          description: Default gRPC call timeout in milliseconds.
          minimum: 0
        color:
          type: string
          description: Hex color code used to represent this service in the visual topology designer.
          example: "#4A90D9"
        shutdownTimeout:
          type: integer
          description: Maximum time in milliseconds to wait for graceful shutdown before forcing termination.
          minimum: 0
        logLevel:
          $ref: '#/components/schemas/LogLevel'
        environment:
          $ref: '#/components/schemas/Environment'
      required:
